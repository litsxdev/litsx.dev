name: Deploy Docs

on:
  workflow_run:
    workflows:
      - Validate Docs
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs
    if: |
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      LITSX_ANALYTICS_PROVIDER: ${{ vars.LITSX_ANALYTICS_PROVIDER }}
      LITSX_GA_MEASUREMENT_ID: ${{ vars.LITSX_GA_MEASUREMENT_ID }}
      LITSX_PLAUSIBLE_DOMAIN: ${{ vars.LITSX_PLAUSIBLE_DOMAIN }}
      LITSX_PLAUSIBLE_API_HOST: ${{ vars.LITSX_PLAUSIBLE_API_HOST }}
      LITSX_SOURCE_DIR: vendor/litsx
    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Checkout LitSX source repository
        uses: actions/checkout@v6
        with:
          repository: litsxdev/litsx
          ref: main
          path: vendor/litsx

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate

      - name: Cache Yarn state
        uses: actions/cache@v5
        with:
          path: |
            .yarn/install-state.gz
            .yarn-cache
          key: ${{ runner.os }}-yarn4-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json', 'packages/**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn4-

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build docs content
        run: corepack yarn docs:build-content

      - name: Build docs site
        run: corepack yarn docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/docs/.vitepress/dist

  deploy:
    name: Deploy Docs
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
